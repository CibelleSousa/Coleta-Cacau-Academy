# Compose de DESENVOLVIMENTO local.
# O atributo `version` foi removido: é obsoleto desde o Compose v2 e gera aviso.
#
# Para produção, veja docs/viabilidade-deploy.md — lá as variáveis vêm do
# ambiente do provedor, NODE_ENV=production e o banco é gerenciado.
services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:15
    container_name: cacau_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # NestJS Backend Service
  # ==========================================
  backend:
    build: ./backend
    container_name: cacau_backend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # development aqui habilita o Swagger em /api/docs. O schema do banco
      # NÃO depende mais disto: desde a adoção de migrations, synchronize é
      # sempre false. Em produção use NODE_ENV=production.
      - NODE_ENV=development
      - PORT=3001
      # Database connection variables matching the postgres service
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      # Auth and Security
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - FRONTEND_URL=${FRONTEND_URL}

volumes:
  postgres_data: